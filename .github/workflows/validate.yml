name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-skills:
    name: Validate skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # No dependencies to install: the validator is zero-dependency, stdlib only.
      - name: Run structural validation
        run: npm run validate
